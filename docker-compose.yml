services:
  db:
    image: pgvector/pgvector:pg15  # includes pgvector extension (TASK-024)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lead_user}
      # Sin default: defínela en .env (fail-fast si falta)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lead_agent}
    ports:
      # Host ocupado (otro Postgres): POSTGRES_HOST_PORT=5433 docker compose up -d db
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data_v2:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MCP Tool Server ────────────────────────────────────────────────────────
  # Runs as a standalone HTTP microservice so the backend never spawns subprocesses.
  # All LLM providers call tools by making HTTP requests to this service.
  mcp-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.mcp.server
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MCP_TRANSPORT=http
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lead_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-lead_agent}
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/sse')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "./migrate.sh"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lead_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-lead_agent}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required — generate with openssl rand -hex 32}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - deal_docs_data:/data/deals
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
          ignore:
            - __pycache__
            - "*.pyc"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lead_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-lead_agent}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required — generate with openssl rand -hex 32}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-2048}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.7}
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma-4-31b-it}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-2048}
      - CLAUDE_TEMPERATURE=${CLAUDE_TEMPERATURE:-0.7}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2048}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-2048}
      - OPENROUTER_TEMPERATURE=${OPENROUTER_TEMPERATURE:-0.7}
      - PROPERTY_LLM_PROVIDER=${PROPERTY_LLM_PROVIDER:-openrouter}
      - PROPERTY_LLM_MODEL=${PROPERTY_LLM_MODEL:-google/gemini-2.5-pro}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET:-}
      - MCP_TRANSPORT=http
      - MCP_SERVER_URL=http://mcp-server:8001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-http://localhost:8000}
      # File storage — local volume for dev; set STORAGE_DRIVER=railway_volume + mount /data in prod
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_PATH=/data/deals
      - STORAGE_SIGNING_SECRET=${SECRET_KEY}
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-true}
      - SEMANTIC_CACHE_THRESHOLD=${SEMANTIC_CACHE_THRESHOLD:-0.92}
      - GEMINI_CONTEXT_CACHING_ENABLED=${GEMINI_CONTEXT_CACHING_ENABLED:-true}
      - GEMINI_CONTEXT_CACHE_TTL=${GEMINI_CONTEXT_CACHE_TTL:-3600}
      # Voice latency tuning (overrides hard-coded defaults in services/stt.py & tts.py)
      - VOICE_PREWARM_ENABLED=${VOICE_PREWARM_ENABLED:-1}
      - VOICE_FILLER_ENABLED=${VOICE_FILLER_ENABLED:-0}
      - DEEPGRAM_ENDPOINTING_MS=${DEEPGRAM_ENDPOINTING_MS:-150}
      - DEEPGRAM_UTTERANCE_END_MS=${DEEPGRAM_UTTERANCE_END_MS:-1000}
      - FISH_AUDIO_LATENCY=${FISH_AUDIO_LATENCY:-low}
      - VOICE_VAD_CONFIDENCE=${VOICE_VAD_CONFIDENCE:-0.8}
      - VOICE_VAD_START_SECS=${VOICE_VAD_START_SECS:-0.2}
      - VOICE_VAD_STOP_SECS=${VOICE_VAD_STOP_SECS:-0.3}
      - VOICE_VAD_MIN_VOLUME=${VOICE_VAD_MIN_VOLUME:-0.6}
      - VOICE_TURN_COALESCE_MS=${VOICE_TURN_COALESCE_MS:-50}
      - OPENROUTER_PROVIDER_SORT=${OPENROUTER_PROVIDER_SORT:-latency}
      - VOICE_LLM_WARMUP_ENABLED=${VOICE_LLM_WARMUP_ENABLED:-1}
      - VOICE_SMART_TURN_ENABLED=${VOICE_SMART_TURN_ENABLED:-1}
      - VOICE_SMART_TURN_MIN_SPEECH_MS=${VOICE_SMART_TURN_MIN_SPEECH_MS:-300}
      - DEEPGRAM_TTFS_P99=${DEEPGRAM_TTFS_P99:-0.30}
      - VOICE_BARGE_GRACE_MS=${VOICE_BARGE_GRACE_MS:-1500}
      - VOICE_BARGE_DISABLED=${VOICE_BARGE_DISABLED:-0}
      - VOICE_PROVIDER=${VOICE_PROVIDER:-vapi}
      # Pipecat voice pipeline
      - TTS_PROVIDER=${TTS_PROVIDER:-fish_audio}
      - DEEPGRAM_TTS_VOICE=${DEEPGRAM_TTS_VOICE:-aura-2-thalia-en}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      - FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY:-}
      - FISH_AUDIO_VOICE_ID=${FISH_AUDIO_VOICE_ID:-}
      - FISH_AUDIO_MODEL=${FISH_AUDIO_MODEL:-s2-pro}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_SIP_DOMAIN=${TWILIO_SIP_DOMAIN:-}
      - TWILIO_DEFAULT_BROKER_ID=${TWILIO_DEFAULT_BROKER_ID:-1}
      - PIPECAT_LOG_LEVEL=${PIPECAT_LOG_LEVEL:-INFO}
      - VAPI_WEBHOOK_SECRET=${VAPI_WEBHOOK_SECRET:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-inmo-backend}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_OAUTH_REDIRECT_URI=${MICROSOFT_OAUTH_REDIRECT_URI:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/broker/calendar/callback}
      # Permite scopes adicionales en el callback OAuth (Google devuelve gmail.* si ya están concedidos)
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      # Permite OAuth sobre HTTP en dev (localhost)
      - OAUTHLIB_INSECURE_TRANSPORT=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lead_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-lead_agent}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-2048}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.7}
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma-4-31b-it}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-2048}
      - CLAUDE_TEMPERATURE=${CLAUDE_TEMPERATURE:-0.7}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2048}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-2048}
      - OPENROUTER_TEMPERATURE=${OPENROUTER_TEMPERATURE:-0.7}
      - PROPERTY_LLM_PROVIDER=${PROPERTY_LLM_PROVIDER:-openrouter}
      - PROPERTY_LLM_MODEL=${PROPERTY_LLM_MODEL:-google/gemini-2.5-pro}
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-true}
      - SEMANTIC_CACHE_THRESHOLD=${SEMANTIC_CACHE_THRESHOLD:-0.92}
      - GEMINI_CONTEXT_CACHING_ENABLED=${GEMINI_CONTEXT_CACHING_ENABLED:-true}
      - GEMINI_CONTEXT_CACHE_TTL=${GEMINI_CONTEXT_CACHE_TTL:-3600}
      - VOICE_PROVIDER=${VOICE_PROVIDER:-vapi}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_OAUTH_REDIRECT_URI=${MICROSOFT_OAUTH_REDIRECT_URI:-}
      - MCP_TRANSPORT=http
      - MCP_SERVER_URL=http://mcp-server:8001
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - db
      - redis
      - backend
      - mcp-server

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lead_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-lead_agent}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - db
      - redis

  # ── Pipecat Voice Agent ────────────────────────────────────────────────────
  # Handles Pipecat pipelines for voice calls. Scales horizontally for concurrent calls.
  # Start: docker compose --profile voice up
  voice-agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.voice_main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lead_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-lead_agent}
      - REDIS_URL=redis://redis:6379/0
      - TTS_PROVIDER=${TTS_PROVIDER:-elevenlabs}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      - FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY:-}
      - FISH_AUDIO_VOICE_ID=${FISH_AUDIO_VOICE_ID:-}
      - FISH_AUDIO_MODEL=${FISH_AUDIO_MODEL:-s2-pro}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_TTS_VOICE=${DEEPGRAM_TTS_VOICE:-aura-2-thalia-en}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_SIP_DOMAIN=${TWILIO_SIP_DOMAIN:-}
      - TWILIO_DEFAULT_BROKER_ID=${TWILIO_DEFAULT_BROKER_ID:-1}
      - PIPECAT_LOG_LEVEL=${PIPECAT_LOG_LEVEL:-INFO}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required — generate with openssl rand -hex 32}
    ports:
      - "8002:8002"
    depends_on:
      - db
      - redis
      - backend
    profiles:
      - voice

  # ── Jaeger — distributed tracing (dev only) ────────────────────────────────
  # Enable tracing: set OTEL_ENABLED=true in backend service environment.
  # UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP/HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles:
      - observability   # start with: docker compose --profile observability up

volumes:
  postgres_data:
  redis_data_v2:
  deal_docs_data:

